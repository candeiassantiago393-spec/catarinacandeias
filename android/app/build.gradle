plugins {
    id 'com.android.application'
}

android {
    namespace 'pt.catarinacandeias.sala'
    compileSdk 34

    defaultConfig {
        applicationId 'pt.catarinacandeias.sala'
        minSdk 24
        targetSdk 34
        versionCode 1
        versionName '1.0'
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation 'androidx.activity:activity:1.9.2'
    implementation 'androidx.core:core:1.13.1'
}
